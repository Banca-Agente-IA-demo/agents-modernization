# Llamador de `publish` del estándar: en cada push de etiqueta sella la unidad, la prueba instalando,
# crea el release, avisa a los marketplaces con `version-published` y actualiza Port.
#
# Marcador del hito 0: el reutilizable aún no existe en agentic-standard. Sólo admite ejecución manual
# y falla a propósito, para que ningún paso termine en verde sin haber hecho su trabajo. El disparador
# definitivo (push de etiquetas) y el `uses: …/publish.yml@v1` llegan con el hito 5.
name: publish

on:
  workflow_dispatch:

permissions: {}

jobs:
  placeholder:
    name: Publicación (pendiente del reutilizable)
    runs-on: ubuntu-latest
    steps:
      - name: Detener con aviso de marcador
        run: |
          echo "::error::publish.yml es un marcador del hito 0; el reutilizable llega con el hito 5."
          exit 1
