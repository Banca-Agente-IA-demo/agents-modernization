# Registro: en cada push a una rama de trabajo, aplica las reglas del estándar a lo que ese push toca.
#
# Es el flujo 1. Este archivo no lleva lógica a propósito: dice cuándo y a quién, y nada más. Si el
# estándar cambia lo que comprueba, aquí no se toca nada.
#
# Sin filtro de rutas: con un filtro, la comprobación no se reporta cuando no hay coincidencia, y ese
# patrón deja esperando para siempre a cualquier comprobación que llegue a ser requerida.
#
# La comprobación aparece como `register / rules`. Ese texto es contrato: sale del id de este job y
# del job del reutilizable. No satisface ninguna de las tres comprobaciones requeridas para fusionar,
# que las emite `verify.yml` y son otra cosa.
name: register

on:
  push:
    branches-ignore:
      - main

# Es el único sitio del diseño donde cancelar es correcto: de una rama de trabajo sólo interesa su
# último estado.
concurrency:
  group: register-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  register:
    uses: Banca-Agente-IA-demo/agentic-standard/.github/workflows/register.yml@v1
    permissions:
      contents: read
