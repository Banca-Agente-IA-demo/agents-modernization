# Llamador de `register` del estándar: en cada push a una rama de trabajo, clasifica la unidad tocada y
# ejecuta las reglas del estándar sobre ella.
#
# Marcador del hito 0: el reutilizable aún no existe en agentic-standard. Sólo admite ejecución manual
# y falla a propósito, para que ningún paso termine en verde sin haber hecho su trabajo. El disparador
# definitivo (push a ramas distintas de main) y el `uses: …/register.yml@v1` llegan con el hito 1.
name: register

on:
  workflow_dispatch:

permissions: {}

jobs:
  rules:
    name: Reglas del estándar (pendiente del reutilizable)
    runs-on: ubuntu-latest
    steps:
      - name: Detener con aviso de marcador
        run: |
          echo "::error::register.yml es un marcador del hito 0; el reutilizable llega con el hito 1."
          exit 1
